# backend/src/main/resources/application.properties
spring.application.name=iot-monitoring

# Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/iot_monitoring?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
# Giữ nguyên cấu trúc database, không tự động cập nhật schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Server configuration
server.port=8081

# MQTT Broker Configuration
mqtt.broker.url=tcp://localhost:1900
mqtt.client.id=SpringBoot-Backend-Server
mqtt.username=b23cn96
mqtt.password=12345678
mqtt.topic.sensor-data=iot/sensors/data
mqtt.topic.device-command=iot/devices/command
mqtt.topic.device-status=iot/devices/status

# Thời gian chờ xác nhận GPIO từ ESP32, tính từ lúc bắt đầu gửi MQTT.
mqtt.command.timeout-ms=5000

# Firmware cũ nhận "LED1 ON". Đổi thành json sau khi tích hợp ACK có commandId.
# text xác nhận lệnh đang chờ bằng trạng thái LED khớp từ ESP32, không có commandId trong ACK.
mqtt.command.format=text
