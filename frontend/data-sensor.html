<!-- frontend/data-sensor.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sensor - IoT Monitoring</title>
    <link rel="stylesheet" href="css/data-sensor.css">
    <link rel="stylesheet" href="css/copy-time.css">
    <script src="js/auth.js"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">IoT PTIT</div>
        <div class="logo-sub">SMART ENVIRONMENT</div>
        <a href="dashboard.html" class="nav-item">
            <span class="icon">📊</span>
            <span>Dashboard</span>
        </a>
        <a href="data-sensor.html" class="nav-item active">
            <span class="icon">📈</span>
            <span>Data Sensor</span>
        </a>
        <a href="active-history.html" class="nav-item">
            <span class="icon">📋</span>
            <span>Active History</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span>
            <span>Profile</span>
        </a>
        <a href="javascript:void(0)" onclick="logout()" class="nav-item" style="color: #ff4d4d;">
            <span class="icon">🚪</span>
            <span>Đăng xuất</span>
        </a>
        <div class="footer-text">IoT Monitoring System • PTIT • 2026</div>
    </nav>

    <div class="main-content">
        <h1 class="page-title">Data Sensor</h1>
        <p class="page-subtitle">Dữ liệu cảm biến • Tìm kiếm • Phân trang</p>

        <!-- Khu vực tìm kiếm -->
        <div class="search-section">
            <div class="search-fields">
                <div class="search-field-group">
                    <label for="searchType">Tìm kiếm theo</label>
                    <select id="searchType" onchange="onSearchTypeChange()">
                        <option value="temperature">Cảm biến nhiệt độ</option>
                        <option value="humidity">Cảm biến độ ẩm</option>
                        <option value="light">Cảm biến ánh sáng</option>
                        <option value="time">Thời gian</option>
                    </select>
                </div>
                <div class="search-field-group">
                    <label for="searchValue" id="searchValueLabel">Giá trị nhiệt độ</label>
                    <input type="text" id="searchValue" placeholder="Nhập giá trị nhiệt độ...">
                </div>
            </div>
            <div class="search-actions">
                <button class="btn-search" onclick="doSearch()">🔍 Tìm kiếm</button>
                <button class="btn-reset" onclick="resetSearch()">✕ Xóa tìm kiếm</button>
                <span style="color:#7a8b9f;margin-left:auto;" id="recordCount">0 bản ghi</span>
            </div>
        </div>

        <div class="card" style="padding:0;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th onclick="sortBy('sensorName')" style="cursor:pointer;">TÊN CẢM BIẾN ↕</th>
                            <th onclick="sortBy('value')" style="cursor:pointer;">GIÁ TRỊ ↕</th>
                            <th onclick="sortBy('measuredAt')" style="cursor:pointer;">THỜI GIAN ĐO ↕</th>
                        </tr>
                    </thead>
                    <tbody id="sensorTableBody">
                        <tr><td colspan="4" style="text-align:center;color:#4a5a6a;">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="pagination">
            <span id="paginationInfo">Hiển thị 0 bản ghi</span>
            <div class="pagination-controls" id="paginationControls"></div>
            <div class="page-size-selector">
                <label for="pageSizeSelect">Hiển thị:</label>
                <select id="pageSizeSelect" onchange="onPageSizeChange()">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                </select>
                <span>bản ghi/trang</span>
            </div>
        </div>
    </div>

    <script src="js/copy-time.js"></script>
    <script src="js/data-sensor.js"></script>
</body>
</html>
