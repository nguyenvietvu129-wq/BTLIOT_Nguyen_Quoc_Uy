<!-- frontend/dashboard.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IoT Monitoring</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">IoT PTIT</div>
        <div class="logo-sub">SMART ENVIRONMENT</div>
        <a href="dashboard.html" class="nav-item active">
            <span class="icon">📊</span>
            <span>Dashboard</span>
        </a>
        <a href="data-sensor.html" class="nav-item">
            <span class="icon">📈</span>
            <span>Data Sensor</span>
        </a>
        <a href="active-history.html" class="nav-item">
            <span class="icon">📋</span>
            <span>Active History</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span>
            <span>Profile</span>
        </a>
        <a href="javascript:void(0)" onclick="logout()" class="nav-item" style="color: #f85149;">
            <span class="icon">🚪</span>
            <span>Đăng xuất</span>
        </a>
        <div class="footer-text">IoT Monitoring System • PTIT • 2026</div>
    </nav>

    <div class="main-content">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Real-time environmental monitoring &amp; device control</p>

        <div class="kpi-grid" id="kpiGrid">
            <!-- KPI cards sẽ được tạo động từ JS dựa trên latestSensors -->
            <div class="kpi-card">
                <div class="kpi-label">📡 Đang tải...</div>
                <div class="kpi-value"><span>--</span></div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Biểu đồ đường duy nhất - tất cả cảm biến -->
            <div class="card">
                <h3 style="margin-bottom: 16px;">📉 Dữ liệu cảm biến theo thời gian thực</h3>
                <div class="chart-wrap">
                    <canvas id="sensorChart"></canvas>
                </div>
            </div>
            <!-- Device Control -->
            <div class="card">
                <h3 style="margin-bottom: 16px;">⚡ Device Control</h3>
                <div id="deviceControls">
                    <!-- Devices will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
